<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Call Center CRM FULL</title>

<style>
body {
margin:0;
font-family:sans-serif;
display:flex;
background:#0f0f0f;
color:white;
}

.sidebar {
width:280px;
background:#1b1b1b;
padding:15px;
height:100vh;
overflow:auto;
}

.main {
flex:1;
padding:20px;
}

input, textarea, button {
width:100%;
padding:10px;
margin-top:8px;
border-radius:6px;
border:none;
box-sizing:border-box;
}

input, textarea {
background:#2a2a2a;
color:white;
}

textarea {
height:140px;
resize:none;
}

.btn { background:#00adb5; color:white; cursor:pointer; }
.btn2 { background:#9b59b6; color:white; cursor:pointer; }
.btn3 { background:#2ecc71; color:white; cursor:pointer; }

.client {
background:#2a2a2a;
padding:10px;
margin-top:8px;
border-radius:6px;
cursor:pointer;
}

.client:hover { background:#333; }

.chat {
height:320px;
overflow:auto;
background:#1e1e1e;
padding:10px;
border-radius:10px;
}

.user { color:#00adb5; margin:5px 0; }
.ai { color:#9b59b6; margin:5px 0; }
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h3>👥 Klijenti</h3>

<input id="name" placeholder="Ime klijenta">
<input id="phone" placeholder="Telefon">

<button class="btn" onclick="addClient()">Dodaj klijenta</button>

<div id="list"></div>

<hr>

<h3>🔑 API Podešavanja</h3>

<input id="groq" type="password" placeholder="Groq API key">
<input id="telnyx" type="password" placeholder="Telnyx API key">
<input id="number" placeholder="Telnyx broj">

<button class="btn" onclick="save()">💾 Sačuvaj</button>

<hr>

<h3>🧠 AI Prompt</h3>

<textarea id="systemPrompt"></textarea>

<button class="btn" onclick="savePrompt()">💾 Save Prompt</button>

</div>

<!-- MAIN -->
<div class="main">

<h2 id="title">📂 Nema izabranog klijenta</h2>

<div class="chat" id="chat"></div>

<input id="msg" placeholder="Poruka...">

<button class="btn" onclick="send()">Pošalji AI</button>
<button class="btn2" onclick="voice()">🎤 Voice</button>
<button class="btn3" onclick="call()">📞 Call AI</button>

</div>

<script>

let clients = JSON.parse(localStorage.getItem("clients") || "{}");
let active = null;

const defaultPrompt =
`Ti si profesionalni AI sales agent u call centru.
Tvoj zadatak je:
- kratki i jasni odgovori
- fokus na prodaju
- vodi korisnika ka akciji
- koristi lokalni jezik (BHS)
`;

function save() {
localStorage.setItem("groq", groq.value);
localStorage.setItem("telnyx", telnyx.value);
localStorage.setItem("number", number.value);
localStorage.setItem("clients", JSON.stringify(clients));
alert("Sačuvano!");
}

function load() {
groq.value = localStorage.getItem("groq") || "";
telnyx.value = localStorage.getItem("telnyx") || "";
number.value = localStorage.getItem("number") || "";
}

// ---------------- PROMPT ----------------

function savePrompt() {
localStorage.setItem("system_prompt", systemPrompt.value);
alert("Prompt sačuvan!");
}

function loadPrompt() {
systemPrompt.value =
localStorage.getItem("system_prompt") || defaultPrompt;
}

// ---------------- CLIENTS ----------------

function addClient() {
if (!name.value || !phone.value) return alert("Popuni polja!");

clients[name.value] = {
phone: phone.value,
chat: []
};

save();
render();
}

function render() {
list.innerHTML = "";

Object.keys(clients).forEach(c => {
let d = document.createElement("div");
d.className = "client";

d.innerHTML = `
<strong>${c}</strong>
<br>
<small>📞 ${clients[c].phone}</small>
`;

d.onclick = () => {
active = c;
title.innerText = "📂 " + c;
draw();
};

list.appendChild(d);
});
}

// ---------------- AI ----------------

async function ai(messages) {

let key = localStorage.getItem("groq");

let system =
localStorage.getItem("system_prompt") || defaultPrompt;

let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
method: "POST",
headers: {
"Authorization": "Bearer " + key,
"Content-Type": "application/json"
},
body: JSON.stringify({
model: "llama3-70b-8192",
messages: [
{ role: "system", content: system },
...messages
]
})
});

let data = await res.json();
return data.choices?.[0]?.message?.content || "AI error";
}

// ---------------- SEND ----------------

async function send() {

if (!active) return alert("Izaberi klijenta");

if (!clients[active].chat) clients[active].chat = [];

clients[active].chat.push({
role: "user",
content: msg.value
});

draw();

let reply = await ai(clients[active].chat);

clients[active].chat.push({
role: "assistant",
content: reply
});

save();
draw();

msg.value = "";
}

// ---------------- DRAW CHAT ----------------

function draw() {
chat.innerHTML = "";

if (!active) return;

let c = clients[active].chat || [];

c.forEach(m => {
let d = document.createElement("div");
d.className = m.role === "user" ? "user" : "ai";

d.innerText =
(m.role === "user" ? "TI: " : "AI: ") + m.content;

chat.appendChild(d);
});

chat.scrollTop = chat.scrollHeight;
}

// ---------------- VOICE ----------------

function voice() {
const S = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!S) return alert("Voice nije podržan");

let r = new S();
r.lang = "bs-BA";

r.onresult = e => {
msg.value = e.results[0][0].transcript;
};

r.start();
}

// ---------------- TELNYX CALL ----------------

async function call() {

if (!active) return alert("Izaberi klijenta");

await fetch("https://YOUR_SUPABASE_FUNCTION/telnyx-call", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
to: clients[active].phone,
telnyx_key: localStorage.getItem("telnyx"),
groq_key: localStorage.getItem("groq"),
name: active
})
});

alert("Call poslat!");
}

// ---------------- INIT ----------------

document.addEventListener("DOMContentLoaded", () => {
load();
render();
loadPrompt();
});

</script>

</body>
</html>
