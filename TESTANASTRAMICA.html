<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<title>PRO AI CRM Panel</title>

<style>
body {
    font-family: sans-serif;
    background: #0f0f0f;
    color: white;
    margin: 0;
    display: flex;
}

.sidebar {
    width: 260px;
    background: #1b1b1b;
    padding: 15px;
    height: 100vh;
    overflow-y: auto;
}

.main {
    flex: 1;
    padding: 20px;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background: #2a2a2a;
    border: 1px solid #333;
    color: white;
    border-radius: 6px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn { background: #00adb5; color: white; }
.btn2 { background: #9b59b6; color: white; }
.btn3 { background: #e74c3c; color: white; }
.btn-dark { background: #444; color: white; }

.client {
    padding: 10px;
    background: #2a2a2a;
    margin-top: 8px;
    border-radius: 6px;
    cursor: pointer;
}

.client:hover { background: #333; }

.chat-box {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 10px;
    height: 300px;
    overflow-y: auto;
}

.msg-user { color: #00adb5; margin: 5px 0; }
.msg-ai { color: #9b59b6; margin: 5px 0; }

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h3>👥 Klijenti</h3>
<input id="clientName" placeholder="Ime klijenta">
<button class="btn" onclick="addClient()">+ Dodaj klijenta</button>
<div id="clients"></div>

<hr>

<!-- NOVO: TELNYX CONFIGURATION -->
<h3>📞 Telnyx Podešavanja</h3>
<label style="font-size: 12px; color: #aaa;">Aktivni Telnyx Broj:</label>
<input id="telnyxNumber" value="+12182558381" placeholder="+1xxxxxxxxxx">

<label style="font-size: 12px; color: #aaa; margin-top: 5px; display: block;">Telnyx API Key:</label>
<input id="telnyxApiKey" type="password" placeholder="Unesi Telnyx API ključ...">
<button class="btn-dark" onclick="saveTelnyxConfig()">💾 Sačuvaj Telnyx</button>

<hr>

<h3>⚙️ AI Prompt</h3>
<textarea id="systemPrompt" rows="10">
Ti si vrhunski AI poslovni asistent specijalizovan za prodaju AI glasovnih agenata koji preuzimaju pozive 24/7 i automatizuju biznise.
Odgovori su 3-4 rečenice i uvijek fokus na benefite automatizacije.
</textarea>
<button class="btn2" onclick="savePrompt()">💾 Sačuvaj prompt</button>

</div>

<!-- MAIN -->
<div class="main">

<h2 id="activeClientTitle">📂 Nema izabranog klijenta</h2>

<div class="chat-box" id="chatBox"></div>

<input id="input" placeholder="Napiši poruku..." />
<button class="btn" onclick="sendMessage()">Pošalji</button>
<button class="btn2" onclick="startMic()">🎤 Mikrofon</button>
<button class="btn3" onclick="exportClient()">💾 Export klijenta</button>

</div>

<script>

const GROQ_API_KEY = "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";

let clients = JSON.parse(localStorage.getItem("clients") || "{}");
let activeClient = null;

// ================= CLIENTS =================
function addClient() {
    let name = document.getElementById("clientName").value.trim();
    if (!name) return;

    if (!clients[name]) {
        clients[name] = { chat: [] };
    }

    save();
    renderClients();
    document.getElementById("clientName").value = "";
}

function renderClients() {
    let div = document.getElementById("clients");
    div.innerHTML = "";

    Object.keys(clients).forEach(name => {
        let el = document.createElement("div");
        el.className = "client";
        el.innerText = name;

        el.onclick = () => {
            activeClient = name;
            document.getElementById("activeClientTitle").innerText = "📂 " + name;
            renderChat();
        };

        div.appendChild(el);
    });
}

function save() {
    localStorage.setItem("clients", JSON.stringify(clients));
}

// ================= TELNYX STORAGE =================
function saveTelnyxConfig() {
    let num = document.getElementById("telnyxNumber").value.trim();
    let key = document.getElementById("telnyxApiKey").value.trim();
    localStorage.setItem("telnyx_number", num);
    localStorage.setItem("telnyx_api_key", key);
    alert("Telnyx podešavanja su uspješno sačuvana!");
}

function loadTelnyxConfig() {
    let savedNum = localStorage.getItem("telnyx_number");
    let savedKey = localStorage.getItem("telnyx_api_key");
    if (savedNum) document.getElementById("telnyxNumber").value = savedNum;
    if (savedKey) document.getElementById("telnyxApiKey").value = savedKey;
}

// ================= CHAT =================
function renderChat() {
    let box = document.getElementById("chatBox");
    box.innerHTML = "";

    if (!activeClient) return;

    clients[activeClient].chat.forEach(m => {
        let div = document.createElement("div");
        div.className = m.role === "user" ? "msg-user" : "msg-ai";
        div.innerText = (m.role === "user" ? "TI: " : "AI: ") + m.content;
        box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
}

// ================= PROMPT =================
function savePrompt() {
    let prompt = document.getElementById("systemPrompt").value;
    localStorage.setItem("system_prompt", prompt);
    alert("AI Prompt je sačuvan!");
}

function loadPrompt() {
    let savedPrompt = localStorage.getItem("system_prompt");
    if (savedPrompt) document.getElementById("systemPrompt").value = savedPrompt;
}

// ================= GROQ =================
async function callAI(text) {
    let prompt = document.getElementById("systemPrompt").value;

    let messages = [
        { role: "system", content: prompt },
        ...clients[activeClient].chat,
        { role: "user", content: text }
    ];

    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + GROQ_API_KEY,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages
        })
    });

    const data = await res.json();
    return data.choices[0].message.content;
}

// ================= SEND =================
async function sendMessage() {
    if (!activeClient) return alert("Izaberi klijenta");

    let input = document.getElementById("input");
    let text = input.value.trim();

    if (!text) return;

    clients[activeClient].chat.push({ role: "user", content: content: text });

    let reply = await callAI(text);

    clients[activeClient].chat.push({ role: "assistant", content: reply });

    save();
    renderChat();

    window.speechSynthesis.speak(new SpeechSynthesisUtterance(reply));

    input.value = "";
}

// ================= MIC =================
let recognition;
function startMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) return alert("Browser ne podržava mikrofon");

    recognition = new SpeechRecognition();
    recognition.lang = "bs-BA";

    recognition.onresult = async (e) => {
        document.getElementById("input").value = e.results[0][0].transcript;
        await sendMessage();
    };

    recognition.start();
}

// ================= EXPORT =================
function exportClient() {
    if (!activeClient) return;

    let text = clients[activeClient].chat
        .map(m => `${m.role.toUpperCase()}: ${m.content}`)
        .join("\n\n");

    let blob = new Blob([text], { type: "text/plain" });

    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = activeClient + "_CRM.txt";
    a.click();
}

// ================= INIT =================
renderClients();
loadTelnyxConfig();
loadPrompt();

</script>

</body>
</html>
