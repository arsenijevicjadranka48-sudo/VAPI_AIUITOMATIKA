<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maksimalno Brzi AI Razgovor (Profesionalni Asistent)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #00adb5; margin-bottom: 20px; }
        .controls-zone {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-mic {
            background-color: #00adb5;
            border: none;
            color: white;
            font-weight: bold;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 10px rgba(0, 173, 181, 0.3);
        }
        .btn-mic.listening {
            background-color: #ff2e63;
            animation: pulse 1.5s infinite;
        }
        .btn-mic.speaking-now {
            background-color: #ff9f43;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 10px;
        }
        .text-input {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
        }
        .output-box {
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            min-height: 80px;
            text-align: left;
            color: #cccccc;
        }
        .status {
            font-size: 15px;
            color: #00adb5;
            font-weight: bold;
            margin-bottom: 10px;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 46, 99, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Poslovni Asistent ⚡</h1>
    <div id="status" class="status">Kliknite za početak</div>
    
    <div class="controls-zone">
        <button id="micBtn" class="btn-mic">🎙️ Pokreni Razgovor</button>
        
        <div class="input-group">
            <textarea id="systemPrompt" class="text-input">Ti si profesionalni AI poslovni asistent. Tvoj cilj je proaktivno nuditi rješenja. Dok "razmišljaš" (prije odgovora), ubaci prirodne uzrečice poput: "Razumijem, trenutak da sagledam sve opcije...", "Jasno, analiziram najbolji put za ovo...", ili "Samo trenutak, obrađujem taj podatak...". Nakon uzrečice, daj kratku i konkretnu ponudu rješenja za korisnikov problem.</textarea>
            <input type="text" id="textIn" class="text-input" style="min-height: 40px;" placeholder="Upišite pitanje..." autocomplete="off">
        </div>
    </div>
    
    <div class="output-box">
        <p><strong>AI:</strong> <span id="aiText">...</span></p>
    </div>
</div>

<script>
    const GROQ_API_KEY = "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"; 
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;
    const micBtn = document.getElementById('micBtn');
    const textIn = document.getElementById('textIn');
    const systemPrompt = document.getElementById('systemPrompt');
    const statusText = document.getElementById('status');
    const aiTextField = document.getElementById('aiText');

    let recognition, isConversationActive = false, isAiSpeaking = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'hr-HR';
        recognition.continuous = true;
        recognition.onresult = async (e) => {
            const text = e.results[e.results.length - 1][0].transcript;
            statusText.innerText = "Analiziram...";
            const response = await pozoviGroqAPI(text);
            aiTextField.innerText = response;
            izgovori(response);
        };
        micBtn.onclick = () => {
            if(!isConversationActive) { recognition.start(); isConversationActive = true; micBtn.innerText = "🛑 STOP"; }
            else { recognition.stop(); isConversationActive = false; micBtn.innerText = "🎙️ Pokreni Razgovor"; }
        };
    }

    textIn.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
            const val = textIn.value;
            textIn.value = "";
            const response = await pozoviGroqAPI(val);
            aiTextField.innerText = response;
            izgovori(response);
        }
    });

    async function pozoviGroqAPI(pitanje) {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: systemPrompt.value }, { role: "user", content: pitanje }]
                })
            });
            const data = await res.json();
            return data.choices[0].message.content;
        } catch(e) { return "Greška u konekciji."; }
    }

    function izgovori(tekst) {
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(tekst);
        utter.lang = 'hr-HR';
        utter.rate = 1.1;
        synth.speak(utter);
        statusText.innerText = "Spreman.";
    }
</script>

</body>
</html>
