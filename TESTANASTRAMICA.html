<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Poslovni Asistent - Konačna verzija</title>

    <style>
        /* Glavni stilovi za stranicu */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        .container { 
            text-align: center; 
            background-color: #1e1e1e; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); 
            max-width: 600px; 
            width: 100%; 
        }

        h1 { color: #00adb5; margin-bottom: 20px; }

        .controls-zone { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            align-items: center; 
            margin-bottom: 20px; 
        }

        .btn-mic { 
            background-color: #00adb5; 
            border: none; 
            color: white; 
            font-weight: bold; 
            padding: 15px 30px; 
            font-size: 18px; 
            border-radius: 50px; 
            cursor: pointer; 
            width: 100%; 
            max-width: 280px; 
        }

        .btn-mic.listening { background-color: #ff2e63; }

        .text-input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background-color: #2a2a2a; 
            color: white; 
            font-size: 14px; 
            box-sizing: border-box; 
        }

        .output-box { 
            padding: 15px; 
            background-color: #2a2a2a; 
            border-radius: 8px; 
            min-height: 80px; 
            text-align: left; 
            color: #cccccc; 
            margin-top: 15px; 
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>AI Poslovni Asistent ⚡</h1>
        
        <div class="controls-zone">
            <button id="micBtn" class="btn-mic">🎙️ Pokreni Razgovor</button>
            
            <textarea id="systemPrompt" class="text-input" rows="12">
Ti si profesionalni AI poslovni asistent.

Ograničenja:
1. Nikada ne zvuči robotski.
2. Dužina svakog odgovora mora biti maksimalno 3 do 4 kratke rečenice.
3. Zadrži fokus na pretvaranju razgovora u konkretan poslovni angažman.

Stil komunikacije:
Dok analiziraš upit, ubaci uzrečice: "Razumijem, trenutak da sagledam sve opcije...", "Samo trenutak, obrađujem taj podatak...", ili "Jasno, analiziram najbolji put za ovo...".

Struktura ponude:
- Problem: Kratko definisanje izazova.
- Rješenje: Kako AI automatizacija rješava problem.
- Benefit: Šta klijent dobija.
- Poziv na akciju.
            </textarea>
            
            <input type="text" id="textIn" class="text-input" placeholder="Upišite pitanje..." autocomplete="off">
        </div>
        
        <div class="output-box">
            <strong>AI odgovor:</strong>
            <p id="aiText">...</p>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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"; 
        const synth = window.speechSynthesis;
        const systemPrompt = document.getElementById('systemPrompt');
        const textIn = document.getElementById('textIn');
        const aiTextField = document.getElementById('aiText');

        async function pozoviGroqAPI(pitanje) {
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${GROQ_API_KEY}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: systemPrompt.value }, 
                            { role: "user", content: pitanje }
                        ]
                    })
                });
                
                const data = await res.json();
                return data.choices[0].message.content;
                
            } catch(e) { 
                return "Greška u konekciji sa API-jem."; 
            }
        }

        textIn.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const response = await pozoviGroqAPI(textIn.value);
                aiTextField.innerText = response;
                
                const utter = new SpeechSynthesisUtterance(response);
                utter.lang = 'hr-HR';
                synth.speak(utter);
            }
        });
    </script>
</body>
</html>
