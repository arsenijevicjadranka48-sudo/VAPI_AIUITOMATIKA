<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Call Center CRM FULL</title>

<style>
/* Čistimo i izolujemo cijeli ekran da sakrijemo zalutali tekst sa servera */
html, body {
margin: 0;
padding: 0;
width: 100vw;
height: 100vh;
overflow: hidden;
background: #0f0f0f;
font-family: sans-serif;
display: flex !important;
}

.sidebar {
width:280px;
background:#1b1b1b;
padding:15px;
height:100vh;
overflow:auto;
box-sizing: border-box;
}

.main {
flex:1;
padding:20px;
}

input, textarea, button {
width:100%;
padding:10px;
margin-top:8px;
border-radius:6px;
border:none;
box-sizing:border-box;
}

input, textarea {
background:#2a2a2a;
color:white;
}

textarea {
height:140px;
resize:none;
}

.btn { background:#00adb5; color:white; cursor:pointer; }
.btn2 { background:#9b59b6; color:white; cursor:pointer; }
.btn3 { background:#2ecc71; color:white; cursor:pointer; }

.client {
background:#2a2a2a;
padding:10px;
margin-top:8px;
border-radius:6px;
cursor:pointer;
}

.client:hover { background:#333; }

.chat {
height:320px;
overflow:auto;
background:#1e1e1e;
padding:10px;
border-radius:10px;
}

.user { color:#00adb5; margin:5px 0; }
.ai { color:#9b59b6; margin:5px 0; }
</style>

</head>

<body>

<div class="sidebar">

<h3>👥 Klijenti</h3>

<input id="name" placeholder="Ime klijenta">
<input id="phone" placeholder="Telefon">

<button class="btn" onclick="addClient()">Dodaj klijenta</button>

<div id="list"></div>

<hr>

<h3>🧠 AI Prompt</h3>

<textarea id="systemPrompt"></textarea>

<button class="btn" onclick="savePrompt()">💾 Save Prompt</button>

</div>

<div class="main">

<h2 id="title">📂 Nema izabranog klijenta</h2>

<div class="chat" id="chat"></div>

<input id="msg" placeholder="Poruka...">

<button class="btn" onclick="send()">Pošalji AI</button>
<button class="btn2" onclick="voice()">🎤 Voice</button>
<button class="btn3" onclick="call()">📞 Call AI</button>

</div>

<script>

// TAČAN URL: Sada gasi tačno telnyx-webhook funkciju sa tvog dashboarda
const FUNCTION_URL = "https://mpgbpgmsorunfbdskbwn.supabase.co/functions/v1/telnyx-webhook";

let clients = JSON.parse(localStorage.getItem("clients") || "{}");
let active = null;

const defaultPrompt =
`Ti si profesionalni AI sales agent u call centru.
Tvoj zadatak je:
- kratki i jasni odgovori
- fokus na prodaju
- vodi korisnika ka akciji
- koristi lokalni jezik (BHS)
`;

function save() {
localStorage.setItem("clients", JSON.stringify(clients));
}

function savePrompt() {
localStorage.setItem("system_prompt", systemPrompt.value);
alert("Prompt sačuvan!");
}

function loadPrompt() {
systemPrompt.value = localStorage.getItem("system_prompt") || defaultPrompt;
}

function addClient() {
if (!name.value || !phone.value) return alert("Popuni polja!");

clients[name.value] = {
phone: phone.value,
chat: []
};

save();
render();
name.value = "";
phone.value = "";
}

function render() {
list.innerHTML = "";

Object.keys(clients).forEach(c => {
let d = document.createElement("div");
d.className = "client";

d.innerHTML = `
<strong>${c}</strong>
<br>
<small>📞 ${clients[c].phone}</small>
`;

d.onclick = () => {
active = c;
title.innerText = "📂 " + c;
draw();
};

list.appendChild(d);
});
}

async function ai(messages) {
let system = localStorage.getItem("system_prompt") || defaultPrompt;

try {
    let res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            action: "chat",
            systemPrompt: system,
            messages: messages
        })
    });

    let data = await res.json();
    return data.reply || "AI error";
} catch (err) {
    console.error(err);
    return "Greška u komunikaciji sa serverom.";
}
}

async function send() {
if (!active) return alert("Izaberi klijenta");
if (!msg.value.trim()) return;

if (!clients[active].chat) clients[active].chat = [];

clients[active].chat.push({
role: "user",
content: msg.value
});

draw();

let trenutnaPoruka = msg.value;
msg.value = "AI razmišlja...";

let reply = await ai(clients[active].chat);

clients[active].chat.push({
role: "assistant",
content: reply
});

save();
draw();
msg.value = "";
}

function draw() {
chat.innerHTML = "";

if (!active) return;

let c = clients[active].chat || [];

c.forEach(m => {
let d = document.createElement("div");
d.className = m.role === "user" ? "user" : "ai";
d.innerText = (m.role === "user" ? "TI: " : "AI: ") + m.content;
chat.appendChild(d);
});

chat.scrollTop = chat.scrollHeight;
}

function voice() {
const S = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!S) return alert("Voice nije podržan u ovom browseru");

let r = new S();
r.lang = "bs-BA";

r.onresult = e => {
msg.value = e.results[0][0].transcript;
};

r.start();
}

async function call() {
if (!active) return alert("Izaberi klijenta");

try {
    let res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            action: "call",
            to: clients[active].phone,
            name: active
        })
    });

    if(res.ok) {
        alert("Poziv uspješno pokrenut preko tvog Telnyx sistema!");
    } else {
        alert("Greška na serveru prilikom pokretanja poziva.");
    }
} catch (err) {
    console.error(err);
    alert("Konekcija sa serverom je prekinuta.");
}
}

document.addEventListener("DOMContentLoaded", () => {
render();
loadPrompt();
});

</script>

</body>
</html>
