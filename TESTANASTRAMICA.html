<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Call Center CRM FULL</title>

<style>
html, body {
margin: 0;
padding: 0;
width: 100vw;
height: 100vh;
overflow: hidden;
background: #0f0f0f;
font-family: sans-serif;
display: flex !important;
}

.sidebar {
width:280px;
background:#1b1b1b;
padding:15px;
height:100vh;
overflow:auto;
box-sizing: border-box;
}

.main {
flex:1;
padding:20px;
display: flex;
flex-direction: column;
}

input, textarea, button, select {
width:100%;
padding:10px;
margin-top:8px;
border-radius:6px;
border:none;
box-sizing:border-box;
}

input, textarea, select {
background:#2a2a2a;
color:white;
}

select {
cursor: pointer;
outline: none;
}

textarea {
height:140px;
resize:none;
}

.btn { background:#00adb5; color:white; cursor:pointer; }
.btn2 { background:#9b59b6; color:white; cursor:pointer; }
.btn3 { background:#2ecc71; color:white; cursor:pointer; }

.client {
background:#2a2a2a;
padding:10px;
margin-top:8px;
border-radius:6px;
cursor:pointer;
}

.client:hover { background:#333; }

.chat {
height:320px;
overflow:auto;
background:#1e1e1e;
padding:10px;
border-radius:10px;
}

.user { color:#00adb5; margin:5px 0; }
.ai { color:#9b59b6; margin:5px 0; }
</style>

</head>

<body>

<div class="sidebar">

<h3>👥 Klijenti</h3>

<input id="clientName" placeholder="Ime klijenta">
<input id="clientPhone" placeholder="Telefon">

<button class="btn" onclick="addClient()">Dodaj klijenta</button>

<div id="list"></div>

<hr>

<h3>🧠 AI Prompt</h3>
<textarea id="systemPrompt"></textarea>
<button class="btn" onclick="savePrompt()">💾 Save Prompt</button>

<hr>

<h3>🎙️ TTS Provajder</h3>
<select id="ttsProvider" onchange="handleProviderChange()">
    <option value="elevenlabs">ElevenLabs</option>
    <option value="deepgram">Deepgram</option>
    <option value="google_tts">Google TTS (Napredni)</option>
    <option value="google_standard" selected>Osnovna Google verzija</option>
</select>

</div>

<div class="main">

<h2 id="title">📂 Nema izabranog klijenta</h2>

<div class="chat" id="chat"></div>

<input id="msg" placeholder="Poruka...">

<button class="btn" onclick="send()">Pošalji AI</button>
<button class="btn2" onclick="voice()">🎤 Voice</button>
<button class="btn3" onclick="call()">📞 Call AI</button>

</div>

<script>
const FUNCTION_URL = "https://mpgbpgmsorunfbdskbwn.supabase.co/functions/v1/telnyx-webhook";

let clients = JSON.parse(localStorage.getItem("clients") || "{}");
let active = null;

const defaultPrompt = `Ti si profesionalni AI sales agent u call centru.

PRAVILO JEZIKA:
- Odgovaraj isključivo na jeziku kojim ti se korisnik obraća
- Ako korisnik piše bosanski, koristi bosanski
- Ako piše engleski, koristi engleski
- Ako piše srpski ili hrvatski, prilagodi stil

Zadatak:
- kratki i jasni odgovori
- prodajni fokus
- vodi korisnika ka akciji`;

function save() {
    localStorage.setItem("clients", JSON.stringify(clients));
}

function savePrompt() {
    const el = document.getElementById("systemPrompt");
    localStorage.setItem("system_prompt", el.value || defaultPrompt);
    alert("Prompt sačuvan!");
}

function loadPrompt() {
    const el = document.getElementById("systemPrompt");
    el.value = localStorage.getItem("system_prompt") || defaultPrompt;
}

function handleProviderChange() {
    const provider = document.getElementById("ttsProvider").value;
    console.log("Logika govora prebačena na: " + provider);
    
    if (provider !== "google_standard") {
        window.speechSynthesis.cancel();
    }
}

function speak(text) {
    const provider = document.getElementById("ttsProvider").value;

    // Stopiraj trenutni govor
    window.speechSynthesis.cancel();

    if (provider === "google_standard") {
        const u = new SpeechSynthesisUtterance(text);
        
        // Određivanje jezičkog koda na osnovu tvog Regex-a
        let targetLang = "bs-BA";
        if (/^[a-zA-Z0-9 .,!?'"()-]+$/.test(text)) {
            targetLang = "en-US";
        }
        u.lang = targetLang;

        // LOGIKA ZA PROMJENU GLASA: Traženje Google glasa u sistemu
        const voices = window.speechSynthesis.getVoices();
        
        // Pokušaj pronaći glas koji pripada ciljanom jeziku I sadrži "Google" u imenu
        let selectedVoice = voices.find(voice => 
            voice.lang.startsWith(targetLang.split('-')[0]) && 
            voice.name.toLowerCase().includes('google')
        );

        // Ako ne nađe striktno Google glas za taj jezik, uzmi bilo koji dostupan za taj jezik
        if (!selectedVoice) {
            selectedVoice = voices.find(voice => voice.lang.startsWith(targetLang.split('-')[0]));
        }

        // Ako je glas uspješno mapiran, dodijeli ga objektu
        if (selectedVoice) {
            u.voice = selectedVoice;
            console.log("Učitani lokalni glas: " + selectedVoice.name);
        }
        
        u.rate = 1;
        window.speechSynthesis.speak(u);
    } else {
        console.log(`Govor se izvršava serverski putem provajdera: ${provider}`);
    }
}

function addClient() {
    const name = document.getElementById("clientName").value.trim();
    const phone = document.getElementById("clientPhone").value.trim();

    if (!name || !phone) return alert("Popuni polja!");

    if (!clients[name]) {
        clients[name] = { phone, chat: [] };
    }

    save();
    render();

    document.getElementById("clientName").value = "";
    document.getElementById("clientPhone").value = "";
}

function render() {
    const listEl = document.getElementById("list");
    const titleEl = document.getElementById("title");

    listEl.innerHTML = "";

    Object.keys(clients).forEach(name => {
        const div = document.createElement("div");
        div.className = "client";

        div.innerHTML = `<strong>${name}</strong><br><small>📞 ${clients[name].phone}</small>`;

        div.onclick = () => {
            active = name;
            titleEl.innerText = "📂 " + name;
            draw();
        };

        listEl.appendChild(div);
    });
}

async function ai(messages, userText) {
    const system = localStorage.getItem("system_prompt") || defaultPrompt;
    const selectedTts = document.getElementById("ttsProvider").value;

    try {
        const res = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                action: "chat",
                systemPrompt: system + "\n\nKORISNIK INPUT: " + userText,
                messages: messages,
                ttsProvider: selectedTts,
                endOnInterruption: true,
                interruptionThreshold: 0.4
            })
        });

        const data = await res.json().catch(() => ({}));
        return data.reply ?? "AI nema odgovor.";
    } catch (err) {
        console.error(err);
        return "Greška u komunikaciji sa serverom.";
    }
}

function detectLang(text) {
    const t = text.toLowerCase();

    if (/[čćžšđ]/.test(t) || t.includes("kako") || t.includes("šta")) return "bs";
    if (t.includes("how") || t.includes("what") || t.includes("hello")) return "en";
    return "auto";
}

async function send() {
    const input = document.getElementById("msg");

    if (!active) return alert("Izaberi klijenta");
    if (!input.value.trim()) return;

    const text = input.value.trim();

    if (!clients[active].chat) clients[active].chat = [];

    clients[active].chat.push({ role: "user", content: text });
    draw();

    input.value = "";

    const langHint = detectLang(text);
    const reply = await ai(clients[active].chat, "LANG=" + langHint);

    clients[active].chat.push({ role: "assistant", content: reply });

    save();
    draw();

    speak(reply);
}

function draw() {
    const chatEl = document.getElementById("chat");
    chatEl.innerHTML = "";

    if (!active || !clients[active]) return;

    const chat = clients[active].chat || [];

    chat.forEach(m => {
        const div = document.createElement("div");
        div.className = m.role === "user" ? "user" : "ai";

        div.innerText =
            (m.role === "user" ? "🎤 KORISNIK: " : "🤖 AI: ") +
            m.content;

        chatEl.appendChild(div);
    });

    chatEl.scrollTop = chatEl.scrollHeight;
}

function voice() {
    const input = document.getElementById("msg");
    const S = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!S) return alert("Voice nije podržan");

    const r = new S();
    r.lang = "bs-BA";
    r.continuous = false;
    r.interimResults = false;

    r.onstart = () => {
        window.speechSynthesis.cancel();
        console.log("Korisnik priča, prekidam trenutni lokalni govor.");
    };

    r.onresult = (e) => {
        input.value = e.results[0][0].transcript;
        send();
    };

    r.start();
}

async function call() {
    if (!active) return alert("Izaberi klijenta");
    const selectedTts = document.getElementById("ttsProvider").value;

    const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            action: "call",
            to: clients[active].phone,
            name: active,
            ttsProvider: selectedTts,
            endOnInterruption: true
        })
    });

    if (res.ok) alert("Poziv pokrenut!");
}

document.addEventListener("DOMContentLoaded", () => {
    render();
    loadPrompt();
    handleProviderChange();
    
    // Osigurava da se lista glasova u browseru učita na vrijeme
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
});
</script>

</body>
</html>
