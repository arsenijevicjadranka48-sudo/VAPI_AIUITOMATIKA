<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maksimalno Brzi AI Razgovor (Bez Zvukova)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #00adb5; margin-bottom: 20px; }
        .controls-zone {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-mic {
            background-color: #00adb5;
            border: none;
            color: white;
            font-weight: bold;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 10px rgba(0, 173, 181, 0.3);
        }
        .btn-mic.listening {
            background-color: #ff2e63;
            animation: pulse 1.5s infinite;
        }
        .btn-mic.speaking-now {
            background-color: #ff9f43;
        }
        .input-group {
            display: flex;
            flex-direction: column; /* Promijenjeno u kolonu radi ljepšeg prikaza textarea + input */
            width: 100%;
            gap: 10px;
        }
        .text-input {
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            width: 100%;
        }
        .output-box {
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            min-height: 80px;
            text-align: left;
            color: #cccccc;
        }
        .status {
            font-size: 15px;
            color: #00adb5;
            font-weight: bold;
            margin-bottom: 10px;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 46, 99, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Brzi AI Razgovor ⚡</h1>
    <div id="status" class="status">Kliknite za početak tečnog razgovora</div>
    
    <div class="controls-zone">
        <button id="micBtn" class="btn-mic">🎙️ Pokreni Tečni Razgovor</button>
        
        <div class="input-group">
            <textarea
                id="systemPrompt"
                class="text-input"
                rows="3"
                placeholder="Upiši AI prompt..."
            >Ti si asistent u brzom telefonskom razgovoru uživo. Odgovori moraju biti ekstremno kratki, doslovno jedna rečenica od par riječi. Odgovaraj munjevito, bez ikakvih uvoda.</textarea>
            <input type="text" id="textIn" class="text-input" placeholder="Upišite pitanje ako nećete glasom..." autocomplete="off">
        </div>
    </div>
    
    <div class="output-box">
        <p><strong>Vi:</strong> <span id="userText">...</span></p>
        <p><strong>Groq AI:</strong> <span id="aiText">...</span></p>
    </div>
</div>

<script>
    // --- POSTAVKE ---
    // OVDJE ZALIJEPI SVOJ NOVI API KLJUČ (Stari ti je bio vidljiv u promptu, obriši ga sa Groq-a!)
    const GROQ_API_KEY = "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"; 
    // ----------------

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    const micBtn = document.getElementById('micBtn');
    const textIn = document.getElementById('textIn');
    const systemPrompt = document.getElementById('systemPrompt');
    const statusText = document.getElementById('status');
    const userTextField = document.getElementById('userText');
    const aiTextField = document.getElementById('aiText');

    let recognition;
    let isConversationActive = false; 
    let isAiSpeaking = false; 

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'hr-HR';
        recognition.continuous = true; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            isConversationActive = true;
            micBtn.className = 'btn-mic listening';
            micBtn.innerText = "🛑 Zaustavi Razgovor";
            statusText.innerText = "Slušam vas... Pričajte slobodno.";
        };

        recognition.onsoundstart = () => {
            if (synth.speaking) {
                synth.cancel();
                isAiSpeaking = false;
                micBtn.className = 'btn-mic listening';
                micBtn.innerText = "🛑 Zaustavi Razgovor";
                statusText.innerText = "Slušam vas... Prekinuli ste me.";
            }
        };

        recognition.onresult = async (event) => {
            if (isAiSpeaking) return;

            const zadnjiRezultat = event.results[event.results.length - 1];
            const speechToText = zadnjiRezultat[0].transcript.trim();
            
            if (speechToText === "") return;

            statusText.innerText = "Šaljem (Munjevito)...";
            obradiPitanje(speechToText);
        };

        recognition.onend = () => {
            if (isConversationActive) {
                try { recognition.start(); } catch(e) {}
            }
        };

        micBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.cancel();
                isAiSpeaking = false;
                micBtn.className = 'btn-mic listening';
                statusText.innerText = "Ućutkan. Slušam vas...";
                return;
            }

            if (!isConversationActive) {
                try { recognition.start(); } catch(e) {}
            } else {
                isConversationActive = false;
                recognition.stop();
                if (synth.speaking) synth.cancel();
                micBtn.className = 'btn-mic';
                micBtn.innerText = "🎙️ Pokreni Tečni Razgovor";
                statusText.innerText = "Razgovor zaustavljen.";
            }
        });
    } else {
        statusText.innerText = "Vaš preglednik ne podržava prepoznavanje glasa.";
    }

    textIn.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter' && textIn.value.trim() !== "") {
            if (synth.speaking) synth.cancel();
            statusText.innerText = "Šaljem...";
            obradiPitanje(textIn.value.trim());
            textIn.value = "";
        }
    });

    async function obradiPitanje(pitanje) {
        userTextField.innerText = pitanje;
        const aiResponse = await pozoviGroqAPI(pitanje);
        aiTextField.innerText = aiResponse;
        izgovori(aiResponse);
    }

    async function pozoviGroqAPI(pitanje) {
        if (!GROQ_API_KEY || GROQ_API_KEY.includes("PASTE_YOUR")) return "Upišite ispravan Groq API ključ!";
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: systemPrompt.value.trim() },
                        { role: "user", content: pitanje }
                    ],
                    temperature: 0.5,
                    max_tokens: 1500
                })
            });
            if (!response.ok) throw new Error();
            const data = await response.json();
            return data.choices[0].message.content;
        } catch (error) {
            return "Problem sa konekcijom ili nevažeći API ključ.";
        }
    }

    function izgovori(tekst) {
        if (synth.speaking) synth.cancel();

        const utterThis = new SpeechSynthesisUtterance(tekst);
        utterThis.lang = 'hr-HR';
        utterThis.pitch = 1.0;
        utterThis.rate = 1.15; 

        utterThis.onstart = () => {
            isAiSpeaking = true; 
            micBtn.className = 'btn-mic speaking-now';
            micBtn.innerText = "🛑 Prekini AI Govor";
            statusText.innerText = "AI govori... Slobodno upadnite u riječ.";
        };

        utterThis.onend = () => {
            isAiSpeaking = false; 
            if (isConversationActive) {
                micBtn.className = 'btn-mic listening';
                micBtn.innerText = "🛑 Zaustavi Razgovor";
                statusText.innerText = "Slušam vas... Govorite.";
            }
        };

        synth.speak(utterThis);
    }
</script>

</body>
</html>
