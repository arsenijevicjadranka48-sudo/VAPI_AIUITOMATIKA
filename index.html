<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Glasovni i Tekstualni AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #f5a623;
            margin-bottom: 20px;
        }
        .controls-zone {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-mic {
            background-color: #f5a623;
            border: none;
            color: #121212;
            font-weight: bold;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            width: 100%;
            max-width: 250px;
        }
        .btn-mic:hover { background-color: #d48b11; }
        .btn-mic.listening {
            background-color: #ff2e63;
            color: white;
            animation: pulse 1.5s infinite;
        }
        .input-group {
            display: flex;
            width: 100%;
            gap: 10px;
        }
        .text-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
        }
        .text-input:focus {
            outline: none;
            border-color: #f5a623;
        }
        .btn-send {
            background-color: #00adb5;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-send:hover { background-color: #007a80; }
        .output-box {
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            min-height: 80px;
            text-align: left;
            color: #cccccc;
        }
        .status {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 46, 99, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Groq Glasovni i Tekstualni AI</h1>
    <div id="status" class="status">Unesite tekst ili kliknite na mikrofon</div>
    
    <div class="controls-zone">
        <!-- Dugme za mikrofon -->
        <button id="micBtn" class="btn-mic">🎙️ Pričaj (Mikrofon)</button>
        
        <!-- NOVO: Tekstualni okvir za kucanje pitanja -->
        <div class="input-group">
            <input type="text" id="textIn" class="text-input" placeholder="Upišite vaše pitanje ovdje..." autocomplete="off">
            <button id="sendBtn" class="btn-send">Pošalji</button>
        </div>
    </div>
    
    <div class="output-box">
        <p><strong>Vi:</strong> <span id="userText">...</span></p>
        <p><strong>Groq AI:</strong> <span id="aiText">...</span></p>
    </div>
</div>

<script>
    // --- POSTAVKE ---
    const GROQ_API_KEY = "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"; // <--- Ovdje zalijepi svoj Groq API ključ
    // ----------------

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');
    const textIn = document.getElementById('textIn');
    const statusText = document.getElementById('status');
    const userTextField = document.getElementById('userText');
    const aiTextField = document.getElementById('aiText');

    let recognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'hr-HR';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            micBtn.classList.add('listening');
            micBtn.innerText = "Slušam...";
            statusText.innerText = "Govorite sada...";
        };

        recognition.onspeechend = () => {
            recognition.stop();
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎙️ Pričaj (Mikrofon)";
            statusText.innerText = "Razmišljam...";
        };

        recognition.onerror = (event) => {
            statusText.innerText = "Greška sa mikrofonom: " + event.error;
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎙️ Pričaj (Mikrofon)";
        };

        recognition.onresult = async (event) => {
            const speechToText = event.results[0][0].transcript;
            obradiPitanje(speechToText);
        };

        micBtn.addEventListener('click', () => {
            recognition.start();
        });
    } else {
        micBtn.style.display = 'none';
        statusText.innerText = "Prepoznavanje glasa nije podržano u ovom browseru. Koristite unos teksta.";
    }

    // Pokretanje procesa na klik dugmeta "Pošalji"
    sendBtn.addEventListener('click', () => {
        izvrsiSlanjeTeksta();
    });

    // Omogućavanje slanja na pritisak tastera Enter u polju
    textIn.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            izvrsiSlanjeTeksta();
        }
    });

    function izvrsiSlanjeTeksta() {
        const tekst = textIn.value.trim();
        if (tekst !== "") {
            statusText.innerText = "Razmišljam...";
            obradiPitanje(tekst);
            textIn.value = ""; // Briše unos nakon slanja
        }
    }

    // Glavna funkcija koja povezuje unos (glas ili tekst), API i izgovor
    async function obradiPitanje(pitanje) {
        userTextField.innerText = pitanje;
        
        // Pozivanje Groq API-ja
        const aiResponse = await pozoviGroqAPI(pitanje);
        aiTextField.innerText = aiResponse;
        
        // Izgovor odgovora
        izgovori(aiResponse);
    }

    async function pozoviGroqAPI(pitanje) {
        if (GROQ_API_KEY === "TVOJ_GROQ_API_KLJUC") {
            return "Greška: Niste unijeli svoj Groq API ključ u kod!";
        }

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        {
                            role: "system",
                            content: "Ti si koristan glasovni asistent. Odgovaraj kratko, jasno i direktno na jeziku na kojem ti je postavljeno pitanje (maksimalno 2-3 rečenice), jer se tvoji odgovori čitaju naglas korisniku."
                        },
                        {
                            role: "user",
                            content: question = pitanje
                        }
                    ],
                    temperature: 0.7,
                    max_tokens: 150
                })
            });

            if (!response.ok) throw new Error(`API status: ${response.status}`);

            const data = await response.json();
            return data.choices[0].message.content;

        } catch (error) {
            console.error(error);
            return "Došlo je do greške u komunikaciji sa AI serverom.";
        }
    }

    function izgovori(tekst) {
        if (synth.speaking) {
            synth.cancel();
        }

        const utterThis = new SpeechSynthesisUtterance(tekst);
        utterThis.lang = 'hr-HR'; // Koristi lokalni sistemski glas (BHS/Hrvatski/Srpski)
        utterThis.pitch = 1.0;
        utterThis.rate = 1.0;

        synth.speak(utterThis);
        
        utterThis.onend = () => {
            statusText.innerText = "Unesite tekst ili kliknite na mikrofon";
        };
    }
</script>

</body>
</html>
