<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Glasovni Asistent (Groq API)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #f5a623;
            margin-bottom: 20px;
        }
        .btn-mic {
            background-color: #f5a623;
            border: none;
            color: #121212;
            font-weight: bold;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(245, 166, 35, 0.3);
        }
        .btn-mic:hover {
            background-color: #d48b11;
        }
        .btn-mic:active {
            transform: scale(0.95);
        }
        .btn-mic.listening {
            background-color: #ff2e63;
            color: white;
            animation: pulse 1.5s infinite;
        }
        .output-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            min-height: 50px;
            text-align: left;
            color: #cccccc;
        }
        .status {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 46, 99, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Groq Glasovni AI</h1>
    <div id="status" class="status">Kliknite na dugme i postavite pitanje</div>
    <button id="micBtn" class="btn-mic">Pokreni Mikrofon</button>
    
    <div class="output-box">
        <p><strong>Vi:</strong> <span id="userText">...</span></p>
        <p><strong>Groq AI:</strong> <span id="aiText">...</span></p>
    </div>
</div>

<script>
    // --- POSTAVKE ---
    const GROQ_API_KEY = "TVOJ_GROQ_API_KLJUC"; // <--- Ovdje zalijepi svoj Groq API ključ
    // ----------------

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    if (!SpeechRecognition) {
        alert("Vaš preglednik ne podržava prepoznavanje glasa. Pokušajte u Google Chrome-u.");
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'hr-HR'; // Jezik prepoznavanja govora
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    const userTextField = document.getElementById('userText');
    const aiTextField = document.getElementById('aiText');

    micBtn.addEventListener('click', () => {
        recognition.start();
    });

    recognition.onstart = () => {
        micBtn.classList.add('listening');
        micBtn.innerText = "Slušam...";
        statusText.innerText = "Govorite sada...";
    };

    recognition.onspeechend = () => {
        recognition.stop();
        micBtn.classList.remove('listening');
        micBtn.innerText = "Pokreni Mikrofon";
        statusText.innerText = "Razmišljam...";
    };

    recognition.onerror = (event) => {
        statusText.innerText = "Greška: " + event.error;
        micBtn.classList.remove('listening');
        micBtn.innerText = "Pokreni Mikrofon";
    };

    recognition.onresult = async (event) => {
        const speechToText = event.results[0][0].transcript;
        userTextField.innerText = speechToText;
        
        // Pozivanje Groq API-ja umjesto lokalnih odgovora
        const aiResponse = await pozoviGroqAPI(speechToText);
        aiTextField.innerText = aiResponse;
        
        // Glasovni odgovor
        izgovori(aiResponse);
    };

    // Funkcija koja komunicira sa Groq API-jem
    async function pozoviGroqAPI(pitanje) {
        if (GROQ_API_KEY === "TVOJ_GROQ_API_KLJUC") {
            return "Greška: Niste unijeli svoj Groq API ključ u kod!";
        }

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile", // Možeš koristiti i "llama3-8b-8192" za brže/jeftinije odgovore
                    messages: [
                        {
                            role: "system",
                            content: "Ti si koristan glasovni asistent. Odgovaraj kratko, jasno i direktno na jeziku na kojem ti je postavljeno pitanje (maksimalno 2-3 rečenice), jer se tvoji odgovori čitaju naglas korisniku."
                        },
                        {
                            role: "user",
                            content: pitanje
                        }
                    ],
                    temperature: 0.7,
                    max_tokens: 150
                })
            });

            if (!response.ok) {
                throw new Error(`API Greška: ${response.status}`);
            }

            const data = await response.json();
            return data.choices[0].message.content;

        } catch (error) {
            console.error("Greška pri pozivanju Groq-a:", error);
            return "Došlo je do greške u komunikaciji sa AI serverom.";
        }
    }

    // Funkcija za sintezu govora
    function izgovori(tekst) {
        if (synth.speaking) {
            synth.cancel();
        }

        const utterThis = new SpeechSynthesisUtterance(tekst);
        utterThis.lang = 'hr-HR'; // Postavljeno na naš jezik
        utterThis.pitch = 1.0;
        utterThis.rate = 1.0;

        synth.speak(utterThis);
        
        utterThis.onend = () => {
            statusText.innerText = "Kliknite na dugme i postavite pitanje";
        };
    }
</script>

</body>
</html>
