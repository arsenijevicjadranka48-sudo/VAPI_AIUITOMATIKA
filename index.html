<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pravi AI Glasovni Razgovor (Hands-Free)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #00adb5;
            margin-bottom: 20px;
        }
        .controls-zone {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-mic {
            background-color: #00adb5;
            border: none;
            color: white;
            font-weight: bold;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 10px rgba(0, 173, 181, 0.3);
        }
        .btn-mic:hover { background-color: #007a80; }
        .btn-mic.listening {
            background-color: #ff2e63;
            animation: pulse 1.5s infinite;
        }
        .input-group {
            display: flex;
            width: 100%;
            gap: 10px;
        }
        .text-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
        }
        .text-input:focus { outline: none; border-color: #00adb5; }
        .btn-send {
            background-color: #444;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .output-box {
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            min-height: 80px;
            text-align: left;
            color: #cccccc;
        }
        .status {
            font-size: 15px;
            color: #00adb5;
            font-weight: bold;
            margin-bottom: 10px;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 46, 99, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pravi AI Razgovor 💬</h1>
    <div id="status" class="status">Kliknite jednom za početak razgovora</div>
    
    <div class="controls-zone">
        <button id="micBtn" class="btn-mic">🎙️ Pokreni Tečni Razgovor</button>
        
        <div class="input-group">
            <input type="text" id="textIn" class="text-input" placeholder="Ili upišite pitanje..." autocomplete="off">
            <button id="sendBtn" class="btn-send">Pošalji</button>
        </div>
    </div>
    
    <div class="output-box">
        <p><strong>Vi:</strong> <span id="userText">...</span></p>
        <p><strong>Groq AI:</strong> <span id="aiText">...</span></p>
    </div>
</div>

<script>
    // --- POSTAVKE ---
    const GROQ_API_KEY = "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"; // <--- Unesi svoj Groq API ključ
    // ----------------

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');
    const textIn = document.getElementById('textIn');
    const statusText = document.getElementById('status');
    const userTextField = document.getElementById('userText');
    const aiTextField = document.getElementById('aiText');

    let recognition;
    let isConversationActive = false; // Prati da li je mod "kontinuiranog razgovora" aktivan

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'hr-HR';
        
        // KLJUČNA PROMJENA: Dozvoljavamo kontinuirano prepoznavanje
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            micBtn.classList.add('listening');
            micBtn.innerText = "🛑 Zaustavi Razgovor";
            statusText.innerText = "Slušam vas... Govorite slobodno.";
        };

        recognition.onerror = (event) => {
            console.log("Status mikrofona:", event.error);
            // Ignorišemo "no-speech" greške da se mikrofon ne bi gasio u tišini
            if (event.error !== 'no-speech') {
                statusText.innerText = "Greška: " + event.error;
            }
        };

        // Kada prestaneš pričati, skripta šalje tekst AI-ju
        recognition.onresult = async (event) => {
            const speechToText = event.results[event.results.length - 1][0].transcript;
            
            // Privremeno gasimo prepoznavanje dok AI razmišlja i govori da sam sebe ne bi slušao
            recognition.stop(); 
            
            statusText.innerText = "AI razmišlja...";
            await obradiPitanje(speechToText);
        };

        // Ako se mikrofon ugasi sam od sebe (pauza), a razgovor je još aktivan, ponovo ga pali
        recognition.onend = () => {
            if (isConversationActive && !synth.speaking) {
                recognition.start();
            }
        };

        // Dugme sada služi kao prekidač (Upali / Ugasi cijeli razgovor)
        micBtn.addEventListener('click', () => {
            if (!isConversationActive) {
                isConversationActive = true;
                recognition.start();
            } else {
                isConversationActive = false;
                recognition.stop();
                if (synth.speaking) synth.cancel();
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎙️ Pokreni Tečni Razgovor";
                statusText.innerText = "Razgovor zaustavljen.";
            }
        });
    }

    sendBtn.addEventListener('click', () => izvrsiSlanjeTeksta());
    textIn.addEventListener('keypress', (e) => { if (e.key === 'Enter') izvrsiSlanjeTeksta(); });

    function izvrsiSlanjeTeksta() {
        const tekst = textIn.value.trim();
        if (tekst !== "") {
            if (isConversationActive) { isConversationActive = false; recognition.stop(); }
            statusText.innerText = "AI razmišlja...";
            obradiPitanje(tekst);
            textIn.value = "";
        }
    }

    async function obradiPitanje(pitanje) {
        userTextField.innerText = pitanje;
        const aiResponse = await pozoviGroqAPI(pitanje);
        aiTextField.innerText = aiResponse;
        izgovori(aiResponse);
    }

    async function pozoviGroqAPI(pitanje) {
        if (GROQ_API_KEY === "TVOJ_GROQ_API_KLJUC") return "Upišite Groq API ključ!";
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        {
                            role: "system",
                            content: "Ti si asistent u živom glasovnom razgovoru. Odgovaraj IZUZETNO KRATKO (najviše jedna do dvije kratke rečenice). Odgovori moraju zvučati prirodno, kao u opuštenom razgovoru uživo. Nikada ne koristi liste, nabrajanja ili markdown zvjezdice."
                        },
                        { role: "user", content: pitanje }
                    ],
                    temperature: 0.7,
                    max_tokens: 100
                })
            });
            if (!response.ok) throw new Error();
            const data = await response.json();
            return data.choices[0].message.content;
        } catch (error) {
            return "Problem sa konekcijom.";
        }
    }

    function izgovori(tekst) {
        if (synth.speaking) synth.cancel();

        const utterThis = new SpeechSynthesisUtterance(tekst);
        utterThis.lang = 'hr-HR';
        utterThis.pitch = 1.0;
        utterThis.rate = 1.05; // Malo ubrzan glas za prirodniji ritam

        synth.speak(utterThis);
        
        statusText.innerText = "AI priča...";

        // KREŠENDO: Kada AI završi sa izgovorom rečenice, AUTOMATSKI ponovo pali mikrofon!
        utterThis.onend = () => {
            if (isConversationActive) {
                statusText.innerText = "Slušam vas... Govorite slobodno.";
                recognition.start();
            } else {
                statusText.innerText = "Kliknite za početak razgovora";
            }
        };
    }
</script>

</body>
</html>
