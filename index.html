<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NH AI-Automation - Cloud Sistem</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; background-color: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); max-width: 500px; width: 100%; }
        h1 { color: #00adb5; }
        .btn-primary { background-color: #00adb5; border: none; color: white; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        #mainPanel { display: none; }
        .output-box { padding: 15px; background-color: #2a2a2a; border-radius: 8px; margin-top: 15px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>NH AI-Automation 💬</h1>
    
    <div id="authPanel">
        <input type="email" id="authEmail" placeholder="Email" style="width:100%; padding:10px; margin-bottom:10px; background:#2a2a2a; border:1px solid #444; color:white;">
        <input type="password" id="authPassword" placeholder="Lozinka" style="width:100%; padding:10px; background:#2a2a2a; border:1px solid #444; color:white;">
        <button id="btnLogin" class="btn-primary">Prijava</button>
    </div>

    <div id="mainPanel">
        <div id="status" style="color: #00adb5; margin-bottom: 15px;">Sistem spreman</div>
        <button id="micBtn" class="btn-primary">🎙️ Pokreni Razgovor</button>
        
        <div class="output-box">
            <p><strong>Korisnik:</strong> <span id="userText">...</span></p>
            <p><strong>Alex (AI):</strong> <span id="aiText">...</span></p>
        </div>
        <button id="btnLogout" style="background:none; border:none; color:red; cursor:pointer; margin-top:20px;">Odjavi se</button>
    </div>
</div>

<script>
    // Supabase inicijalizacija sa tvojim ključevima
    const SUPABASE_URL = "https://fbvwvkjurcbdnbrfknig.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ev8H-_ck4SgcNZDqdV_6iA__-Fy-Mmi";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Auth logika
    const btnLogin = document.getElementById('btnLogin');
    btnLogin.addEventListener('click', async () => {
        const { error } = await supabase.auth.signInWithPassword({
            email: document.getElementById('authEmail').value,
            password: document.getElementById('authPassword').value
        });
        if (error) alert(error.message); else location.reload();
    });

    // Funkcija za AI chat (poziva Edge Function u Supabase-u)
    async function pozoviZaštićeniBackend(message) {
        try {
            const { data, error } = await supabase.functions.invoke('chat-process', {
                body: { message, userId: (await supabase.auth.getUser()).data.user.id }
            });
            if (error) throw error;
            return data?.reply || "Nema odgovora od AI-a.";
        } catch (e) {
            console.error(e);
            return "Greška pri pozivu funkcije. Provjeri Edge Function!";
        }
    }

    // Glasovna logika
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'bs-BA';

    recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById('userText').innerText = text;
        const aiResponse = await pozoviZaštićeniBackend(text);
        document.getElementById('aiText').innerText = aiResponse;
        izgovori(aiResponse);
    };

    function izgovori(t) {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'hr-HR';
        window.speechSynthesis.speak(u);
    }

    document.getElementById('micBtn').addEventListener('click', () => recognition.start());

    // Provjera sesije
    supabase.auth.getSession().then(({ data }) => {
        if (data.session) {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
        }
    });
</script>
</body>
</html>
