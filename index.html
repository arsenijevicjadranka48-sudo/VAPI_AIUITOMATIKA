<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <title>NH AI-Automation - Cloud Sistem</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: white; box-sizing: border-box; border-radius: 5px; }
        button { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; background: #00adb5; border: none; color: white; border-radius: 5px; font-weight: bold; }
        button.secondary { background: #444; }
        button.danger { background: #dc3545; }
        #mainPanel, #changePassPanel { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>NH AI-Automation</h2>
    
    <div id="authPanel">
        <input type="email" id="email" placeholder="Email adresa">
        <input type="password" id="password" placeholder="Lozinka">
        <button id="btnLogin">Prijava</button>
        <button id="btnRegister" class="secondary">Registracija</button>
    </div>

    <div id="mainPanel">
        <p>Dobrodošli u sistem!</p>
        <button id="btnShowPass" class="secondary">Promijeni lozinku</button>
        <button id="btnLogout" class="danger">Odjava</button>
    </div>

    <div id="changePassPanel">
        <input type="password" id="newPassword" placeholder="Nova lozinka">
        <button id="btnUpdatePass">Ažuriraj lozinku</button>
        <button id="btnCancelPass" class="secondary">Nazad</button>
    </div>
</div>

<script>
    // 1. Definiši ključeve
    const SUPABASE_URL = "https://fbvwvkjurcbdnbrfknig.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ev8H-_ck4SgcNZDqdV_6iA__-Fy-Mmi";
    
    // 2. KORISTI 'db' UMJESTO 'supabase' ZA SVE DALJE OPERACIJE
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // 3. Povezivanje sa HTML-om
    const btnLogin = document.getElementById('btnLogin');
    const btnRegister = document.getElementById('btnRegister');

    // Prijava (koristimo db.auth...)
    btnLogin.addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) alert("Greška: " + error.message);
        else location.reload();
    });

    // Registracija (koristimo db.auth...)
    btnRegister.addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const { error } = await db.auth.signUp({ email, password });
        if (error) alert("Greška: " + error.message);
        else alert("Registracija uspješna, provjerite email!");
    });
</script>
</body>
</html>
