<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NH AI-Automation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#121212;
    color:#ffffff;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:380px;
    background:#1e1e1e;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    box-sizing:border-box;
    border-radius:6px;
    border:1px solid #444;
    background:#2a2a2a;
    color:white;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.primary{background:#00adb5;color:white;}
.secondary{background:#444;color:white;}
.danger{background:#dc3545;color:white;}

#mainPanel,#changePassPanel{display:none;}
</style>
</head>
<body>

<div class="container">
<h2>NH AI-Automation</h2>

<div id="authPanel">
<input type="email" id="email" placeholder="Email adresa">
<input type="password" id="password" placeholder="Lozinka">

<button id="btnLogin" class="primary">Prijava</button>
<button id="btnRegister" class="secondary">Registracija</button>
</div>

<div id="mainPanel">
<p>Dobrodošli u sistem!</p>
<p id="loggedEmail"></p>

<button id="btnShowPass" class="secondary">Promijeni lozinku</button>
<button id="btnLogout" class="danger">Odjava</button>
</div>

<div id="changePassPanel">
<input type="password" id="newPassword" placeholder="Nova lozinka">

<button id="btnUpdatePass" class="primary">Ažuriraj lozinku</button>
<button id="btnCancelPass" class="secondary">Nazad</button>
</div>
</div>

<script>
// 1. Ispravna inicijalizacija klijenta
const { createClient } = supabase; 

const SUPABASE_URL = "https://fbxwvkjurcbdnbrfknig.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ev8H-_ck4SgcNZDqdV_6iA__-Fy-Mmi"; 

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Konfiguracija asistenta
const assistantVoice = {
    name: 'Google US English',
    lang: 'en-US'
};

function speak(text) {
    if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const selectedVoice = voices.find(v => v.name === assistantVoice.name) || voices[0];
        
        utterance.voice = selectedVoice;
        utterance.lang = assistantVoice.lang;
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        
        window.speechSynthesis.speak(utterance);
    }
}

// Ostatak tvojih funkcija...
const authPanel = document.getElementById("authPanel");
const mainPanel = document.getElementById("mainPanel");
const changePassPanel = document.getElementById("changePassPanel");
const loggedEmail = document.getElementById("loggedEmail");

async function checkSession(){
    const { data:{session} } = await db.auth.getSession();
    if(session){
        authPanel.style.display="none";
        mainPanel.style.display="block";
        loggedEmail.textContent=session.user.email;
    } else {
        authPanel.style.display="block";
        mainPanel.style.display="none";
    }
}

document.getElementById("btnRegister").addEventListener("click", async ()=>{
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    const {error}=await db.auth.signUp({email,password});
    if(error){ alert(error.message); return; }
    alert("Registracija uspješna. Provjerite email.");
});

document.getElementById("btnLogin").addEventListener("click", async ()=>{
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    const {error}=await db.auth.signInWithPassword({email,password});
    if(error){ alert(error.message); return; }
    
    checkSession();
    speak("Login successful. Welcome back!");
});

document.getElementById("btnLogout").addEventListener("click", async ()=>{
    await db.auth.signOut();
    checkSession();
});

document.getElementById("btnShowPass").addEventListener("click", ()=>{
    mainPanel.style.display="none";
    changePassPanel.style.display="block";
});

document.getElementById("btnCancelPass").addEventListener("click", ()=>{
    changePassPanel.style.display="none";
    mainPanel.style.display="block";
});

document.getElementById("btnUpdatePass").addEventListener("click", async ()=>{
    const newPassword=document.getElementById("newPassword").value;
    const {error}=await db.auth.updateUser({password:newPassword});
    if(error){ alert(error.message); return; }
    alert("Lozinka promijenjena.");
    changePassPanel.style.display="none";
    mainPanel.style.display="block";
});

checkSession();
</script>
    </body>
</html>
