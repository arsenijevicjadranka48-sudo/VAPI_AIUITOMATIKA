<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <title>NH AI-Automation - Cloud Sistem</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; padding: 50px; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 400px; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #2a2a2a; border: 1px solid #444; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; background: #00adb5; border: none; color: white; border-radius: 5px; }
        #mainPanel, #changePassPanel { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>NH AI-Automation</h1>
    
    <div id="authPanel">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Lozinka">
        <button id="btnLogin">Prijava</button>
        <button id="btnRegister" style="background:#444;">Registracija</button>
    </div>

    <div id="mainPanel">
        <p>Uspješno prijavljeni!</p>
        <button id="btnShowPass">Promijeni lozinku</button>
        <button id="btnLogout" style="background:red;">Odjava</button>
    </div>

    <div id="changePassPanel">
        <input type="password" id="newPassword" placeholder="Nova lozinka">
        <button id="btnUpdatePass">Ažuriraj lozinku</button>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://fbvwvkjurcbdnbrfknig.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ev8H-_ck4SgcNZDqdV_6iA__-Fy-Mmi";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Prijava
    document.getElementById('btnLogin').onclick = async () => {
        const { error } = await db.auth.signInWithPassword({ 
            email: document.getElementById('email').value, 
            password: document.getElementById('password').value 
        });
        if (error) alert(error.message); else location.reload();
    };

    // Registracija
    document.getElementById('btnRegister').onclick = async () => {
        const { error } = await db.auth.signUp({ 
            email: document.getElementById('email').value, 
            password: document.getElementById('password').value 
        });
        if (error) alert(error.message); else alert("Provjerite email!");
    };

    // UI prebacivanje
    document.getElementById('btnShowPass').onclick = () => {
        document.getElementById('mainPanel').style.display = 'none';
        document.getElementById('changePassPanel').style.display = 'block';
    };

    // Promjena lozinke
    document.getElementById('btnUpdatePass').onclick = async () => {
        const { error } = await db.auth.updateUser({ password: document.getElementById('newPassword').value });
        if (error) alert(error.message); else alert("Lozinka promijenjena!");
    };

    // Odjava
    document.getElementById('btnLogout').onclick = async () => { 
        await db.auth.signOut(); location.reload(); 
    };

    // Provjera sesije
    db.auth.getSession().then(({ data }) => {
        if (data.session) {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
        }
    });
</script>
</body>
</html>
