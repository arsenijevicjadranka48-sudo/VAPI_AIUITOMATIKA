YPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NH AI-Automation</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: #121212;
    color: #ffffff;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container{
    width: 380px;
    background: #1e1e1e;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,.4);
    text-align: center;
}

input{
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: white;
}

button{
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.primary{background: #00adb5; color: white;}
.secondary{background: #444; color: white;}
.danger{background: #dc3545; color: white;}
.accent{background: #28a745; color: white; margin-top: 20px; border: 1px solid #1e7e34;}
.accent:hover{background: #218838;}

#mainPanel, #changePassPanel{display: none;}
</style>
</head>
<body>

<div class="container">
<h2>NH AI-Automation</h2>

<div id="authPanel">
<input type="email" id="email" placeholder="Email adresa">
<input type="password" id="password" placeholder="Lozinka">

<button id="btnLogin" class="primary">Prijava</button>
<button id="btnRegister" class="secondary">Registracija</button>

<button id="btnDirectTest" class="accent">🚀 Pokreni Test Stranicu (Bez prijave)</button>
</div>

<div id="mainPanel">
<p>Dobrodošli u sistem!</p>
<p id="loggedEmail"></p>

<button id="btnShowPass" class="secondary">Promijeni lozinku</button>
<button id="btnLogout" class="danger">Odjava</button>
</div>

<div id="changePassPanel">
<input type="password" id="newPassword" placeholder="Nova lozinka">

<button id="btnUpdatePass" class="primary">Ažuriraj lozinku</button>
<button id="btnCancelPass" class="secondary">Nazad</button>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzE4FRHSfPHSIXewTtjUFEG1ip2NHR7FEQ7idUfkvrB5HeQlHv668UG_B8VIV1DPrbP/exec";

const authPanel = document.getElementById("authPanel");
const mainPanel = document.getElementById("mainPanel");
const changePassPanel = document.getElementById("changePassPanel");
const loggedEmailText = document.getElementById("loggedEmail");

function speak(text) {
    if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }
}

function checkSession() {
    const user = localStorage.getItem("loggedUser");
    if (user) {
        authPanel.style.display = "none";
        changePassPanel.style.display = "none";
        mainPanel.style.display = "block";
        loggedEmailText.textContent = "Prijavljeni ste kao: " + user;
    } else {
        authPanel.style.display = "block";
        mainPanel.style.display = "none";
        changePassPanel.style.display = "none";
        loggedEmailText.textContent = "";
    }
}

// REGISTRACIJA
document.getElementById("btnRegister").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) { alert("Unesite email i lozinku za registraciju!"); return; }
    try {
        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "register", email, password })
        });
        const result = await response.json();
        if (result.status === "success") { alert("Registracija uspješna! Sada se možete prijaviti."); } 
        else { alert(result.message || "Greška pri registraciji."); }
    } catch (error) { alert("Greška: " + error.message); }
});

// PRIJAVA
document.getElementById("btnLogin").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) { alert("Unesite email i lozinku!"); return; }
    try {
        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "login", email, password })
        });
        const result = await response.json();
        if (result.status === "success") {
            localStorage.setItem("loggedUser", result.email || email);
            checkSession();
            speak("Login successful. Welcome back!");
        } else { alert(result.message || "Pogrešan email ili lozinka!"); }
    } catch (error) { alert("Došlo je do greške pri provjeri."); }
});

// PROMJENA LOZINKE
document.getElementById("btnUpdatePass").addEventListener("click", async () => {
    const newPassword = document.getElementById("newPassword").value;
    const email = localStorage.getItem("loggedUser");
    if (!newPassword || !email) { alert("Greška sa podacima!"); return; }
    try {
        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "updatePassword", email, password: newPassword })
        });
        const result = await response.json();
        if (result.status === "success") {
            alert("Lozinka uspješno promijenjena.");
            changePassPanel.style.display = "none";
            mainPanel.style.display = "block";
        } else { alert(result.message || "Neuspješna promjena lozinke."); }
    } catch (error) { alert("Greška prilikom izmjene lozinke."); }
});

// ODJAVA
document.getElementById("btnLogout").addEventListener("click", () => {
    localStorage.removeItem("loggedUser");
    checkSession();
});

// NAVIGACIJA
document.getElementById("btnShowPass").addEventListener("click", () => {
    mainPanel.style.display = "none";
    changePassPanel.style.display = "block";
});

document.getElementById("btnCancelPass").addEventListener("click", () => {
    changePassPanel.style.display = "none";
    mainPanel.style.display = "block";
});

// POPRAVLJENO DUGME ZA TEST STRANICU
document.getElementById("btnDirectTest").addEventListener("click", () => {
    console.log("Dugme je kliknuto, pokrećem preusmjeravanje...");
    
    // Provjera da li se fajl tačno ovako zove (PAZI NA VELIKA SLOVA)
    window.location.href = "TESTANASTRAMICA.html"; 
});

checkSession();
</script>
</body>
</html>
